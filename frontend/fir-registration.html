<!DOCTYPE html>
<html>

<head>
    <title>FIR Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Register FIR</h1>

    <form>

        <label>Complaint Title</label>
        <input type="text" required>

        <label>Complaint Description</label>
        <textarea rows="5"></textarea>

        <label>Incident Location</label>
        <input type="text">

        <button type="submit">
            Submit FIR
        </button>

    </form>

</body>

</html>
